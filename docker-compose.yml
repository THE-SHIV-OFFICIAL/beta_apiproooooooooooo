services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      DB_PATH: /app/data/bot_data.db
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - betaapi-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  betaapi-data:
